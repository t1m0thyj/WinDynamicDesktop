version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "src"
    schedule:
      interval: "daily"
    ignore:
      # https://github.com/dependabot/dependabot-core/issues/13923
      - dependency-name: "SkiaSharp.Views.WindowsForms"
